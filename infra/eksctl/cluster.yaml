apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: aws-eks-project
  region: eu-north-1
  tags:
    Project: aws-eks-project

iam:
  withOIDC: true
  serviceAccounts:
    - metadata:
        name: eso-db-secret-reader
        namespace: external-secrets
      attachPolicyARNs:
        - arn:aws:iam::180571023536:policy/aws-eks-project-db-secret-reader
    - metadata:
        name: alertmanager
        namespace: monitoring
      attachPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sns:Publish
            Resource: arn:aws:sns:eu-north-1:180571023536:aws-eks-project-alerts
          - Effect: Allow
            Action:
              - kms:GenerateDataKey
              - kms:Decrypt
            Resource: arn:aws:kms:eu-north-1:180571023536:key/0dac8595-0f09-4a4f-805c-0a419183dfed
    - metadata:
        name: fluent-bit
        namespace: monitoring
      attachPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: arn:aws:logs:eu-north-1:180571023536:log-group:/aws-eks-project/containers:*

accessConfig:
  authenticationMode: API_AND_CONFIG_MAP
  accessEntries:
    - principalARN: arn:aws:iam::180571023536:role/aws-eks-project-deploy-role
      accessPolicies:
        - policyARN: arn:aws:eks::aws:cluster-access-policy/AmazonEKSEditPolicy
          accessScope:
            type: namespace
            namespaces:
              - default

vpc:
  nat:
    gateway: Disable

managedNodeGroups:
  - name: workers
    instanceType: t3.medium
    spot: false
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    volumeSize: 20
    privateNetworking: false
    labels:
      role: worker
    tags:
      Project: aws-eks-project

addons:
  - name: metrics-server
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true
