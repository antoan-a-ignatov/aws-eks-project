apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 91.8.2
    releaseName: kube-prometheus-stack
    namespace: monitoring
    valuesFile: kube-prometheus-stack-values.yaml
    includeCRDs: true

resources:
  - deployment-no-replicas-rule.yaml

configMapGenerator:
  - name: aws-eks-project-dashboard
    namespace: monitoring
    files:
      - dashboards/aws-eks-project-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/part-of: aws-eks-project
