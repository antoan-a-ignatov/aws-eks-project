apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/monitoring

labels:
  - pairs:
      environment: dev
    includeSelectors: false

patches:
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: PrometheusRule
      name: aws-eks-project-alerts
    patch: |-
      - op: add
        path: /spec/groups/0/rules/0/labels/environment
        value: dev
